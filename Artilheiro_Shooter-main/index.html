<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Artilheiro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="controls">
        <span><kbd>←</kbd> <kbd>→</kbd> ou <kbd>A</kbd> <kbd>D</kbd> mover</span>
        <span><kbd>ESPAÇO</kbd> atirar</span>
        <span><kbd>X</kbd> tiro especial</span>
        <span><kbd>P</kbd> pausar</span>
      </div>
    </header>

    <section class="hud" aria-label="Status da partida">
      <div class="stat"><span>PONTUAÇÃO</span><strong id="score">0</strong></div>
      <div class="stat"><span>VIDAS</span><strong id="lives">3</strong></div>
      <div class="stat"><span>ONDA</span><strong id="wave">1</strong></div>
    </section>

    <div class="canvas-frame">
      <canvas id="game" width="480" height="640" aria-label="Jogo espacial"></canvas>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
